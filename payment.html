<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Page</title>
<style>
  :root{
    --accent:#ffbf00; /* Bright yellow */
    --muted:#989a9e;
    --card:#ffffff;
    --bg:#fffacd;
    --shadow:0 6px 18px rgba(0,0,0,0.06);
    font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
  }
  body{margin:0;background:var(--bg);color:#020e09;padding:20px;}
  h1{color:var(--accent);text-align:center;margin-bottom:20px;}
  .container{max-width:800px;margin:0 auto;background:var(--card);padding:20px;border-radius:12px;box-shadow:var(--shadow);}
  table{width:100%;border-collapse:collapse;margin-bottom:20px;}
  th, td{padding:12px;text-align:left;border-bottom:1px solid #e6e6e6;}
  th{background:#fff4b2;}
  input{width:100%;padding:10px;border:1px solid #e6e6e6;border-radius:8px;margin-bottom:12px;}
  button{padding:12px 20px;border:none;background:var(--accent);color:white;border-radius:8px;font-size:16px;cursor:pointer;}
  button:hover{opacity:0.85;}
  .whatsapp{margin-top:10px;text-align:center;}
  .whatsapp a{display:inline-block;padding:10px 16px;background:#25D366;color:white;border-radius:8px;text-decoration:none;font-weight:600;}
  .whatsapp a:hover{opacity:0.85;}
  label{font-weight:600;margin-bottom:4px;display:block;}
</style>
</head>
<body>

<div class="container">
  <h1>Payment Page</h1>

  <h2>Order Summary</h2>
  <table id="orderTable">
    <thead>
      <tr>
        <th>Product</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody>
      <!-- Dynamically filled -->
    </tbody>
  </table>

  <h2>Customer Information</h2>
  <form id="paymentForm">
    <label for="name">Full Name</label>
    <input type="text" id="name" placeholder="Youssef " required>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="2ymeeeen@example.com" required>

    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" placeholder="+212612345678" required>

    <label for="address">Address</label>
    <input type="text" id="address" placeholder="Your address" required>

    <button type="submit">Confirm Payment</button>
  </form>

  <div class="whatsapp" id="whatsappDiv" style="display:none;">
    <p>Send your order via WhatsApp:</p>
    <a id="whatsappLink" href="#" target="_blank">Open WhatsApp</a>
  </div>
</div>

<script>
  // Simulated product info (pass from previous page)
  const product = {
    title: "Wireless Earbuds",
    price: 9.99,
    quantity: 1
  };

  const tbody = document.querySelector("#orderTable tbody");
  const total = (product.price * product.quantity).toFixed(2);

  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td>${product.title}</td>
    <td>$${product.price.toFixed(2)}</td>
    <td>${product.quantity}</td>
    <td>$${total}</td>
  `;
  tbody.appendChild(tr);

  // Handle form submit
  const form = document.getElementById("paymentForm");
  form.addEventListener("submit", function(e){
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const address = document.getElementById("address").value.trim();

    if(!name || !email || !phone || !address){
      alert("Please fill all fields.");
      return;
    }

    // Generate WhatsApp message
    const msg = `Hello, I want to confirm my order:\n\n` +
                `Product: ${product.title}\n` +
                `Price: $${product.price.toFixed(2)}\n` +
                `Quantity: ${product.quantity}\n` +
                `Total: $${total}\n\n` +
                `Customer Info:\nName: ${name}\nEmail: ${email}\nPhone: ${phone}\nAddress: ${address}`;

    const whatsappUrl = `https://wa.me/${phone.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`;

    const whatsappDiv = document.getElementById("whatsappDiv");
    const whatsappLink = document.getElementById("whatsappLink");
    whatsappLink.href = whatsappUrl;
    whatsappDiv.style.display = "block";

    alert("Your order is ready! Click the WhatsApp button to send it.");
  });
</script>

</body>
</html>
